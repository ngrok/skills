name: Drift

# ngrok's docs can change without a commit here, so no PR would catch it. This is
# the one scheduled workflow. Weekly, it:
#   - refreshes the action catalog snapshot and opens a PR if anything changed
#   - checks every docs link, action type, and error code against the live docs
#     on main, and fails the run if one is broken

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-catalog:
    # The PR is opened with the docs bot's token, not GITHUB_TOKEN, so this
    # job's own token stays read-only.
    runs-on: ubuntu-latest
    steps:
      # A PR opened with the default GITHUB_TOKEN does not trigger CI, so use
      # the ngrok docs bot (a GitHub App). The token lasts one hour, is scoped
      # to this repo, and has only the two permissions the PR step needs.
      - name: Generate bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.NGROK_DOCS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.NGROK_DOCS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the docs snapshot
        run: python3 scripts/gen_action_catalog.py fetch

      - name: Render the catalog
        run: python3 scripts/gen_action_catalog.py render

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.bot.outputs.token }}
          branch: bot/action-catalog
          delete-branch: true
          commit-message: regenerate action catalog from docs
          title: Regenerate Traffic Policy action catalog
          body: |
            ngrok's Traffic Policy docs changed. This PR updates the snapshot
            (`scripts/data/traffic-policy-actions.json`) and the generated files.

            Before merging:
            - A new action may deserve a mention in `skills/ngrok-engine/SKILL.md`.
            - A removed or renamed action may still be used by a job skill.

  docs:
    # Link rot unrelated to actions, such as a moved page or a removed error
    # code. A failure here means main is out of date with the docs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check docs links, action types, and error codes
        run: uv run --with pyyaml==6.0.3 scripts/validate.py --docs

# Traffic policy for putting an ngrok cloud endpoint in front of any HTTP-reachable MCP server.

on_http_request:
  - name: Only allow the MCP endpoint path
    expressions:
      - "!req.url.path.startsWith('/mcp')"
    actions:
      - type: deny

  - name: claude
    expressions:
      - "'authorization' in req.headers && req.headers['authorization'].join(',') == 'Bearer ' + secrets.get('mcp-callers', 'claude-key')"
    actions:
      - type: add-headers
        config:
          headers:
            x-mcp-caller: claude
      - type: forward-internal
        config:
          url: https://mcp.internal

  - name: open-ai
    expressions:
      - "'authorization' in req.headers && req.headers['authorization'].join(',') == 'Bearer ' + secrets.get('mcp-callers', 'openai-key')"
    actions:
      - type: add-headers
        config:
          headers:
            x-mcp-caller: open-ai
      - type: forward-internal
        config:
          url: https://mcp.internal

  # Catch-all: anything that didn't match a known caller token is rejected.
  - name: Reject unauthenticated or unrecognized requests
    actions:
      - type: custom-response
        config:
          status_code: 401
          body: "Unauthorized"
